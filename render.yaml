services:
  - type: web
    name: railsense-backend
    env: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/wsgi.py"
    healthCheckPath: /api/health/ready
    envVars:
      - key: RAILSENSE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
        sync: false
      - key: ENABLE_DOCS
        value: "true"
      - key: FLASK_THREADS
        value: "4"
      - key: FLASK_HOST
        value: "0.0.0.0"
      # Zero TIDB_* variables (TiDB is strictly detached from runtime)
