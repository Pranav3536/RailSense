openapi: 3.0.3
info:
  title: RailSense Delay Intelligence & Prediction REST API
  description: High-performance, leakage-safe REST API for Indian Railways delay intelligence, historical pattern exploration, and pre-departure delay probability forecasting. Built with Flask, precomputed SQLite serving store, and calibrated LightGBM GBDT models.
  version: 1.0.0
  contact:
    name: RailSense Project Team
servers:
  - url: http://localhost:5000
    description: Local development server
paths:
  /api/health:
    get:
      summary: Lightweight Liveness Probe
      description: Returns 200 OK without database or disk I/O for container liveness monitoring.
      responses:
        '200':
          description: Service is live
  /api/health/ready:
    get:
      summary: Readiness Probe
      description: Validates model artifact readiness, serving store connectivity, and live TiDB Cloud connectivity (with 3-second timeout).
      responses:
        '200':
          description: All subsystems ready
        '503':
          description: Subsystem unavailable
  /api/overview:
    get:
      summary: Dataset Macro Overview
      description: Returns macro dataset statistics, delayed definition, category breakdown, and worst observed delay hotspots.
      responses:
        '200':
          description: Macro overview statistics
  /api/trains:
    get:
      summary: Search & Paginate Train Catalog
      parameters:
        - name: q
          in: query
          description: Search train number prefix or train name substring
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category (SUB, MEX, SUF, EXP, etc.)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated train records
        '400':
          description: Invalid query parameters
  /api/trains/{train_number}:
    get:
      summary: Train Profile & Route Schedule
      parameters:
        - name: train_number
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Train route profile and stops schedule
        '404':
          description: Train not found in catalog
  /api/stations:
    get:
      summary: Search & Paginate Station Catalog
      parameters:
        - name: q
          in: query
          description: Search station code prefix
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated station records
  /api/stations/{station_code}:
    get:
      summary: Station Profile & Calling Trains
      parameters:
        - name: station_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station details and calling trains
        '404':
          description: Station not found in catalog
  /api/patterns/{kind}:
    get:
      summary: Temporal & Spatial Empirical Patterns
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [hour, dow, category, position, hotspots]
      responses:
        '200':
          description: Precomputed pattern distributions
        '400':
          description: Invalid pattern kind
  /api/model/info:
    get:
      summary: Model Architecture & Split Boundaries
      responses:
        '200':
          description: Deployment model metadata
  /api/model/metrics:
    get:
      summary: Evaluation Benchmark Lab
      responses:
        '200':
          description: Full model evaluation benchmark
  /api/predict:
    post:
      summary: Pre-Departure Delay Prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - train_number
                - station_code
                - date
              properties:
                train_number:
                  type: string
                  example: "12951"
                station_code:
                  type: string
                  example: "BRC"
                date:
                  type: string
                  format: date
                  example: "2026-10-26"
                seq:
                  type: integer
                  example: 5
      responses:
        '200':
          description: Prediction result with calibrated probability and factors
        '400':
          description: Invalid request payload or date format
        '404':
          description: Train or station not found on route
        '422':
          description: Origin stop (seq=1) or multiple stops require sequence number
